kind = "web"
previewPath = "/"
title = "Real-time Chat"
description = "A responsive WhatsApp-style real-time messaging app for up to 450 users, with conversations, presence, typing indicators, message status, and group chat foundations."
version = "1.0.0"
id = "artifacts/real-time-chat"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20844

[services.development]
run = "pnpm --filter @workspace/real-time-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/real-time-chat", "run", "build" ]
serve = "static"
publicDir = "artifacts/real-time-chat/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20844"
BASE_PATH = "/"
