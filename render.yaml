services:
  - type: web
    name: nexchat-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: corepack pnpm@10 install --frozen-lockfile && corepack pnpm@10 --filter @workspace/api-server build
    startCommand: corepack pnpm@10 --filter @workspace/api-server start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: NEXCHAT_ADMIN_USERNAME
        generateValue: true
      - key: NEXCHAT_ADMIN_PASSWORD
        generateValue: true
